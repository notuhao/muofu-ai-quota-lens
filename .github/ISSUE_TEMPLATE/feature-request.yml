name: 功能建议
description: 提议符合本地优先与最小权限边界的改进
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题，再描述方案。项目默认不接受主动调用私有用量 API、读取认证信息、扩大抓取范围或传输用户数据的功能。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么情况下遇到什么困难？不要附真实账号数据。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户可见行为和最小实现边界。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括不做该功能或仅改文档是否可行。

  - type: dropdown
    id: impact
    attributes:
      label: 预计影响
      options:
        - 仅界面或文档
        - 本地计算或展示
        - 本地存储 schema
        - 页面观察或跨 world contract
        - Manifest 权限或外部通信
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我没有附带 Cookie、Token、HAR、对话、真实用量或账号信息。
          required: true
        - label: 我理解新增权限、外部通信或主动私有 API 请求需要先更新 accepted spec，且可能不被接受。
          required: true
