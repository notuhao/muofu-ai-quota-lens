name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run tests and static privacy review
        run: npm run check

      - name: Run Mozilla add-on linter
        run: npm run lint:addon

      - name: Build reproducible public artifacts
        run: npm run package

      - name: Audit archives and checksums
        run: npm run audit
