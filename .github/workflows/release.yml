name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  draft-release:
    name: Build unsigned development artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_DATE_EPOCH: "315532800"
      ARTIFACT_PREFIX: muofu-ai-quota-lens-firefox
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag, package, and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must use vMAJOR.MINOR.PATCH: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$package_version" != "$manifest_version" ]]; then
            printf 'package.json (%s) and manifest.json (%s) do not match\n' "$package_version" "$manifest_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            printf 'Tag %s does not match package version %s\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run tests and static privacy review
        run: npm run check

      - name: Run Mozilla add-on linter
        run: npm run lint:addon

      - name: Build reproducible public artifacts
        run: npm run package

      - name: Audit archives and checksums
        run: npm run audit

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            开发/审查制品，不是面向普通用户的正式安装包。

            *-unsigned.xpi 未签名，仅用于 Firefox 临时开发加载或人工审查；标准 Firefox 安装可能拒绝它。
            正式安装请使用可用的 AMO 签名版本。本流程不会向 AMO 提交或签名任何制品。
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xpi="release/${ARTIFACT_PREFIX}-${version}-unsigned.xpi"
          source_zip="release/${ARTIFACT_PREFIX}-${version}-source.zip"
          checksums="release/${ARTIFACT_PREFIX}-${version}-SHA256SUMS.txt"
          for artifact in "$xpi" "$source_zip" "$checksums"; do
            test -f "$artifact"
          done
          gh release create "$GITHUB_REF_NAME" \
            "$xpi" "$source_zip" "$checksums" \
            --draft \
            --verify-tag \
            --title "Muofu AI Quota Lens $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
